<!-- Portal view -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Turf Rush</title>
        <link rel="stylesheet" href="assets/css/host.css">
        
        <style>
            .portal-container {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 24px;
            }

            .portal-box {
                background: var(--bg-card);
                border: 4px solid var(--border-bright);
                box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 12px 35px rgba(0, 0, 0, 0.9);
                padding: 40px 36px;
                border-radius: 12px;
                width: 100%;
                max-width: 480px; /* Un poco más de ancho para acomodar label + input cómodamente */
                text-align: center;
                display: flex;
                flex-direction: column;
            }

            .portal-lang-wrapper {
                display: flex;
                justify-content: flex-end;
                margin-bottom: 8px;
            }

            .portal-box h1 {
                color: var(--accent-gold);
                font-size: 2.3rem;
                letter-spacing: 3px;
                margin-bottom: 6px;
                line-height: 1.1;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            }

            .portal-box p {
                color: var(--text-muted);
                font-size: 0.95rem;
                margin-bottom: 28px;
            }

            .divider {
                display: flex;
                align-items: center;
                text-align: center;
                margin: 28px 0;
                color: var(--border-main);
                font-weight: 700;
                font-size: 0.85rem;
                letter-spacing: 1.5px;
            }

            .divider::before, 
            .divider::after {
                content: '';
                flex: 1;
                border-bottom: 1px solid var(--border-main);
            }

            .divider:not(:empty)::before { 
                margin-right: 14px; 
            }

            .divider:not(:empty)::after { 
                margin-left: 14px; 
            }

            /* Alineación en una misma fila (Label a la izquierda, Input a la derecha) */
            .portal-row-group {
                display: grid;
                grid-template-columns: 130px 1fr;
                align-items: center;
                gap: 16px;
                margin-bottom: 18px;
                text-align: left;
            }

            .portal-row-group label {
                font-weight: 700;
                color: var(--text-muted);
                font-size: 0.9rem;
                letter-spacing: 0.5px;
                white-space: nowrap;
                line-height: 1;
            }

            .portal-row-group .config-input {
                height: 44px;
                font-size: 1rem;
            }

            .btn-portal-action {
                width: 100%;
                height: 48px;
                font-size: 1rem;
                font-weight: 800;
                letter-spacing: 1px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    
    <body class="theme-western">
        <div class="portal-container">
            <div class="portal-box">
                <div class="portal-lang-wrapper">
                    <select id="portalLang" class="config-select" style="width: auto; padding: 4px 10px; font-size: 0.8rem; height: auto;">
                        <option value="en" selected>EN</option>
                        <option value="es">ES</option>
                    </select>
                </div>

                <h1 id="portalTitle">TURF RUSH</h1>
                <p id="portalSub">Based on the game: Ready Set Bet</p>

                <button id="btnHost" class="primary btn-portal-action">
                    HOST A GAME
                </button>

                <div class="divider" id="portalDivider">OR JOIN AS PLAYER</div>

                <!-- Join form -->
                <form id="joinForm">
                    <div class="portal-row-group">
                        <label for="roomInput" id="lblRoomInput">Room Code:</label>
                        <input 
                            type="text" 
                            id="roomInput" 
                            class="config-input" 
                            placeholder="X9B2K7" 
                            maxlength="6" 
                            required 
                            style="text-align: center; text-transform: uppercase; letter-spacing: 3px; font-size: 1.1rem;"
                        >
                    </div>

                    <div class="portal-row-group" style="margin-bottom: 28px;">
                        <label for="nameInput" id="lblNameInput">Player Name:</label>
                        <input 
                            type="text" 
                            id="nameInput" 
                            class="config-input" 
                            placeholder="Nickname" 
                            maxlength="12" 
                            required
                            style="text-align: center;"
                        >
                    </div>

                    <button type="submit" id="btnJoinSubmit" class="btn-portal-action">
                        JOIN ROOM
                    </button>
                </form>
            </div>
        </div>

        <script src="lang/i18n.js"></script>
        <script src="assets/js/ui/i18n_ui.js"></script>
        <script src="assets/js/ui/portal_ui.js"></script>
    </body>
</html>
